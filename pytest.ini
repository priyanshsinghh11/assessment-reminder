[pytest]
testpaths = tests
python_files = test_*.py

# tests/test_access.py IS NOT COLLECTED HERE, and that is not an oversight.
#
# It is the access-rule regression test, it is the most important test in the
# repository, and it is a SCRIPT rather than a pytest suite: it runs against a
# real, populated MongoDB, borrows an existing hiring manager's address and a
# role they do not own, and creates and deletes throwaway accounts as it goes.
# Collected here it would either fail on a machine with no database or, worse,
# skip its way to green against an empty one.
#
# It has its own entry point and is run deliberately, against staging:
#
#     python test_access.py
#
# What IS collected below is the other half -- the pure logic that needs no
# database, no network and no credentials, so it can run on every commit.
addopts = --ignore=tests/test_access.py -q

filterwarnings =
    error::RuntimeWarning
