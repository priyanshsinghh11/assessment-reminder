# The daily recruiting report, posted to a Google Chat space.
#
# 8:00 AM NEW YORK TIME, STARTED FROM OUTSIDE. There is no `schedule` here on
# purpose. GitHub's scheduler is best-effort, and on this repository it is far
# worse than "a few minutes late": in November 2026 sync.yml's 03:00 UTC cron
# started around 11:00, and the hourly grading cron ran three times a day. A
# post meant for 8 AM cannot ride on that. A workflow_dispatch starts within
# seconds, so an outside clock calls GitHub's API instead:
#
#   cron-job.org, time zone America/New_York (so daylight saving is its problem)
#     06:30  POST .../actions/workflows/sync.yml/dispatches    {"ref":"main"}
#     08:00  POST .../actions/workflows/report.yml/dispatches  {"ref":"main"}
#   with a fine-grained GitHub token limited to this repository, Actions:
#   read and write. README "The daily recruiting report" has the steps.
#
# The sync goes first so "the last 24 hours" is measured against fresh data.
# If it is late or fails, the report still posts at 8 and says how old its data
# is -- a warning beats a silent space, which is what the brief asked to avoid.
#
# NOT IN THE `batch` GROUP. It writes nothing the other jobs touch -- only its
# own bookmark -- so there is nothing to serialise against, and waiting behind
# an hourly grading run would only make it late.
#
# WHO GETS IT is the Chat space's membership. Add or remove people in Chat;
# nothing here changes.

name: Daily recruiting report

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Leave empty for the daily report (since the last one). A number posts a test window of that many hours and leaves the daily bookmark alone."
        required: false
        default: ""

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    env:
      # --- Required. The guard step below fails the run if one is missing. ---
      MONGO_URI: ${{ secrets.MONGO_URI }}
      # The space's incoming webhook. A credential: anyone holding it can post
      # there. The report logs status codes only, never the URL.
      GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}

      # --- Configuration, not secrets. Read with _env(), so unset is safe. ---
      MONGO_DB: ${{ vars.MONGO_DB }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refuse to run without credentials
        # MONGO_URI defaults to 127.0.0.1, which on a runner is nothing at all:
        # the report would post "no new applicants" to the whole space, look
        # entirely successful, and be false.
        run: |
          missing=""
          for name in MONGO_URI GOOGLE_CHAT_WEBHOOK_URL; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi
          echo "credentials present"

      - name: Build and post the report
        # The report holds counts and role names only, never a candidate, so
        # nothing it logs is private -- this repository's run pages are public.
        env:
          HOURS: ${{ github.event.inputs.hours }}
        run: |
          if [ -n "$HOURS" ]; then
            python manage.py report --hours "$HOURS"
          else
            python manage.py report
          fi
