# AI grading, one role an hour, on a real machine.
#
# WHY THIS IS NOT ON VERCEL. api/index.py has the long version. The short one:
# a Hobby function is capped at 300 seconds -- that is the default AND the
# maximum, Hobby cannot raise it -- and backend/config.py budgets 360 seconds
# for a SINGLE candidate (LLM_CANDIDATE_BUDGET), against a measured 146s to
# first token plus 24s to write the verdict. One candidate does not fit, never
# mind a role. A runner has six hours and a real process, so `manage.py grade`
# runs here exactly as it runs on a laptop, unmodified.
#
# WHY THIS IS SEPARATE FROM sync.yml. They used to be two steps of one job on
# one schedule. They are split because they want different cadences --
# submissions are pulled once a day, grading runs every hour -- and a single
# job cannot carry two schedules. Two consequences worth knowing:
#
#   * They MUST NOT overlap. Ingest's stage 3 moves submissions between the
#     `rejected` and `pending` buckets while this walks the pending queue, so
#     the two race over the same documents. Being separate workflows does not
#     separate the database; the shared `concurrency` group below is what keeps
#     them apart, and it is not optional.
#   * This job no longer sees the portal password at all. Nothing under
#     `manage.py grade` logs into the portal -- grading reads what the sync
#     already wrote to Mongo -- so those secrets are not passed here.
#
# ONE ROLE PER RUN, IN TURN. `--next` picks the published role that has work
# waiting and was graded least recently, and grades up to --limit of it. So the
# first hour takes one role, the next hour takes a different one, and the roles
# come round in turn -- 50 candidates at a time, an hour apart.
#
# Nothing stores that rotation. Grading a role updates its newest `graded_at`,
# which is what sends it to the back of the queue, so the order survives a
# re-run, a cancelled job and a role being added or unpublished. A role with
# an empty queue is skipped rather than spending the hour, and a role nobody
# has graded yet goes first. backend/pipeline/grade.py:_next_role is the rule;
# tests/test_rotation.py pins it.

name: Grading

on:
  schedule:
    # Every hour, at half past. HALF PAST ON PURPOSE: sync.yml runs at 03:00
    # and roles-crawl.yml at 04:00 on Mondays, both on the hour, and all three
    # share one concurrency group -- starting on the hour would just make one
    # queue behind another. :30 also avoids the busiest minute on GitHub's
    # shared scheduler.
    #
    # That scheduler is best-effort and is delayed under load, sometimes by
    # tens of minutes -- treat this as "roughly hourly", not as a clock. A late
    # or dropped hour costs nothing: the rotation is driven by which role was
    # graded least recently, not by what time it is, so the next run picks up
    # exactly where this one would have.
    - cron: "30 * * * *"
  workflow_dispatch:
    inputs:
      grade_limit:
        description: "Max submissions to grade for the role picked (0 = no cap)"
        required: false
        default: "50"

# Shared with sync.yml and roles-crawl.yml. See the header: these three all
# touch the same collections, and this group is the only thing serialising
# them. `cancel-in-progress: false` because cancelling mid-grade abandons
# candidates the LLM has already been billed for; a queued run picks up the
# same backlog later and skips whoever got scored in the meantime.
#
# GitHub keeps at most ONE run pending per group and drops any older pending
# one. At an hourly cadence that is the intended behaviour rather than a loss:
# a dropped run would have graded the role that the next run now picks, because
# nothing about the rotation depends on a run having happened.
concurrency:
  group: batch
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    # The grading step has its own tighter `timeout` below; this is the outer
    # backstop. It is deliberately under the ONE-HOUR gap between runs, so a
    # hung job dies before the next one is due rather than blocking it through
    # the shared concurrency group.
    timeout-minutes: 55

    env:
      # --- Required. The guard step below fails the run if one is missing. ---
      MONGO_URI: ${{ secrets.MONGO_URI }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      # Best effort, so it is not in the guard: this decides which of a
      # family's grids a candidate is marked against. Unset, every candidate
      # falls back to the default (the senior) grid rather than being skipped
      # -- see _resolve_tiers in backend/pipeline/grade.py.
      WORKABLE_API_TOKEN: ${{ secrets.WORKABLE_API_TOKEN }}

      # --- The privacy switch, and it is not optional here. ---
      # This repository is public, so this job's stdout is a world-readable,
      # indexed, permanent page. A grading run prints each candidate's name,
      # score, hire recommendation, the model's brief about them, and any
      # FRAUD LOG entry with the quote behind it. Off, the run still reports
      # roles, counts and how many tells fired -- it just never says who.
      # Removing this line publishes candidate names on the next scheduled run
      # and nothing on the run page would say so. tests/test_guards.py pins it.
      LOG_CANDIDATE_DETAIL: "0"

      # --- Configuration, not secrets. Set these as repository VARIABLES. ---
      # AN UNDEFINED REPOSITORY VARIABLE ARRIVES AS THE EMPTY STRING, not as
      # an unset name, so every line below always sets its variable -- to ""
      # when no repository variable exists. backend/config.py reads these with
      # _env(), which treats empty as unset. Without that, LLM_CONCURRENCY
      # reached int("") and grading died with a ValueError at import, before
      # running a line of its own code.
      #
      # NOTE the runner has no .env -- it is gitignored and never checked out
      # -- so these and the defaults in config.py are all the run sees.
      # LLM_CONCURRENCY in particular falls back to 6 here, not to whatever a
      # laptop's .env says.
      MONGO_DB: ${{ vars.MONGO_DB }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      LLM_CONCURRENCY: ${{ vars.LLM_CONCURRENCY }}

      # AUTOMATION_ENABLED IS DELIBERATELY ABSENT. It gates the reminder SEND
      # (backend/mail/reminder.py), not grading, and it is off by design --
      # while it is off, reminders go out from the dashboard after a human has
      # looked at who is eligible. Nothing in this file mails a candidate, and
      # setting it here would not change that. Read crontab.example before
      # turning reminders back on anywhere.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refuse to run without credentials
        # Checked here rather than left to the command, because none of these
        # fail loudly on their own.
        #
        # MONGO_URI defaults to 127.0.0.1:27017, which on a runner is nothing
        # at all -- the run would report an empty queue against a database that
        # was never there.
        #
        # LLM_BASE_URL and LLM_MODEL are worse, and they are the reason this
        # step checks VARIABLES and not just secrets. Their defaults in
        # backend/config.py are Groq's endpoint and an NVIDIA model name -- a
        # combination that belongs to no single provider and is left over from
        # a migration. Unset here, the run would POST LLM_API_KEY to
        # api.groq.com: a key sent to a vendor nobody chose, to ask for a model
        # that vendor does not serve. A failed request that leaks a credential
        # is not an acceptable default, so both must be stated explicitly.
        run: |
          missing=""
          for name in MONGO_URI LLM_API_KEY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi

          unstated=""
          for name in LLM_BASE_URL LLM_MODEL; do
            if [ -z "${!name}" ]; then unstated="$unstated $name"; fi
          done
          if [ -n "$unstated" ]; then
            echo "::error::Missing repository variable(s):$unstated"
            echo "These have no safe default -- config.py falls back to Groq's"
            echo "endpoint with an NVIDIA model name, which would send your"
            echo "LLM_API_KEY to a provider you did not choose."
            echo "Settings -> Secrets and variables -> Actions -> Variables"
            exit 1
          fi

          # Named so a run page shows which provider was actually called.
          # Neither value is a secret; the key they authenticate with is.
          echo "credentials present"
          echo "provider: $LLM_BASE_URL"
          echo "model:    $LLM_MODEL"

      - name: Grade one role
        # --next picks the role, --limit caps how much of it is graded. NOT
        # --all: that walks all ~33 published roles in one run, and at a limit
        # of 50 apiece it would be 1,650 candidates and roughly thirteen hours
        # of model calls in a job that gets one.
        #
        # WHY 50 FITS AN HOUR. At LLM_CONCURRENCY=6 and a measured ~170s a
        # candidate, 50 candidates is 50/6 x 170s, about 24 minutes. Install
        # and checkout add two or three. That leaves roughly half the hour as
        # slack, which is the margin for a slow provider -- not headroom to
        # spend by raising the limit. Doubling it to 100 is ~48 minutes and
        # would start colliding with the next run through the shared
        # concurrency group, so measure before changing this number.
        #
        # `timeout` is the backstop under that arithmetic: whatever the work
        # turns out to be, the step stops after 45 minutes, inside the
        # 55-minute job ceiling and inside the hour before the next run.
        # Grading writes each verdict as it completes, so a stop loses only the
        # handful in flight; the rest stay pending and this role keeps its
        # place at the front of the rotation until they are done.
        #
        # Exit 3 is the provider's daily token budget, and it is the one to
        # watch at this cadence: 50 an hour is up to 1,200 candidates a day,
        # which is a different order of spend from what this used to do. grade.py
        # gives it its own code precisely so a wrapper can tell "come back
        # later" apart from "something is broken" without parsing the log.
        # Exit 2 is individual candidates that failed -- the run stands, they
        # stay pending, and a later run retries them.
        run: |
          limit="${{ github.event.inputs.grade_limit }}"
          limit="${limit:-50}"
          set +e
          timeout --signal=INT 2700 python manage.py grade --next --limit "$limit"
          code=$?
          set -e
          case $code in
            0) echo "grading ok" ;;
            2) echo "::warning::Something needs a human: either individual candidates failed to grade, or a role could not be graded at all (usually a grid that will not derive from its assessment text). The run stands and the queue is not stuck -- a role that cannot be graded is stepped over, not retried forever -- but read the log above, because nothing else will report this." ;;
            3) echo "::warning::Stopped on the provider's daily token budget. Already-scored candidates are skipped, so the next run resumes the queue. At 50/hour this is the limit to expect first." ;;
            124) echo "::warning::Grading hit the 45-minute bound and was stopped. Every verdict completed before that point is saved; the rest stay pending and this role stays at the front of the rotation." ;;
            *) echo "::error::Grading failed (exit $code)."; exit $code ;;
          esac
