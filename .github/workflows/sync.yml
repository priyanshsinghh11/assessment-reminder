# The portal sync, once a day, on a real machine.
#
# WHY THIS IS NOT ON VERCEL. api/index.py has the long version. The short one:
# a Hobby function is capped at 300 seconds -- that is the default AND the
# maximum, Hobby cannot raise it -- and Hobby cron is once per day, +/-59
# minutes. A runner has six hours, a writable disk and a real process, so
# `manage.py ingest` runs here exactly as it runs on a laptop, unmodified.
#
# Vercel still serves the dashboard and the review surface. That half is
# request-shaped Mongo work and already works there. This is the other half.
#
# WHY THIS IS SEPARATE FROM grade.yml. They used to be two steps of one job on
# one schedule. They are split because they want different cadences --
# submissions are pulled once a day, grading runs every hour and takes one role
# at a time -- and a single job cannot carry two schedules. Two consequences
# worth knowing:
#
#   * They MUST NOT overlap. Ingest's stage 3 moves submissions between the
#     `rejected` and `pending` buckets while grading walks the pending queue,
#     so the two race over the same documents. Being separate workflows does
#     not separate the database; the shared `concurrency` group below is what
#     keeps them apart, and it is not optional.
#   * This job no longer sees the LLM key at all. Nothing under
#     `manage.py ingest` reads LLM_API_KEY, so it is not passed here -- one
#     fewer runner with a billable credential in its environment.
#
# The overlap nothing can detect is still a laptop: `manage.py grade` run by
# hand while this fires is on another machine, and `concurrency` does not
# reach across machines.

name: Portal sync

on:
  schedule:
    # 03:00 UTC daily. An ODD hour on purpose: grade.yml runs on even hours,
    # and a shared start time would just make one queue behind the other.
    #
    # GitHub's scheduler is best-effort and is delayed under load, sometimes by
    # tens of minutes -- treat this as "once a day", not as a clock. Nothing
    # downstream depends on the exact minute, because ingest is idempotent.
    - cron: "0 3 * * *"
  workflow_dispatch:

# Shared with grade.yml and roles-crawl.yml. See the header: these three all
# write the same collections, and this group is the only thing serialising
# them. `cancel-in-progress: false` because a half-finished sync is not a
# useful thing to leave behind; a queued run does the same work later.
concurrency:
  group: batch
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # The crawl is bounded by PORTAL_CRAWL_DELAY rather than by CPU, so this is
    # a backstop against a hung fetch, not a budget anyone should be near.
    timeout-minutes: 45

    env:
      # --- Required. The guard step below fails the run if one is missing. ---
      MONGO_URI: ${{ secrets.MONGO_URI }}
      PORTAL_EMAIL: ${{ secrets.PORTAL_EMAIL }}
      PORTAL_PASSWORD: ${{ secrets.PORTAL_PASSWORD }}

      # --- Configuration, not secrets. Set this as a repository VARIABLE. ---
      # AN UNDEFINED REPOSITORY VARIABLE ARRIVES AS THE EMPTY STRING, not as
      # an unset name. This line therefore always sets MONGO_DB; when no
      # variable exists it sets it to "". backend/config.py reads it with
      # _env(), which treats empty as unset -- without that, the first run
      # here died on `database name cannot be the empty string` having
      # reached Atlas perfectly well.
      #
      # NOTE the runner has no .env -- it is gitignored and never checked out
      # -- so this and the defaults in config.py are all the run sees.
      MONGO_DB: ${{ vars.MONGO_DB }}

      # AUTOMATION_ENABLED IS DELIBERATELY ABSENT. It gates the reminder SEND
      # (backend/mail/reminder.py), not ingest, and it is off by design --
      # while it is off, reminders go out from the dashboard after a human has
      # looked at who is eligible. Nothing in this file mails a candidate, and
      # setting it here would not change that. Read crontab.example before
      # turning reminders back on anywhere.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refuse to run without credentials
        # Checked here rather than left to the command, because none of these
        # fail loudly on their own. MONGO_URI is the dangerous one: it defaults
        # to 127.0.0.1:27017, which on a runner is nothing at all -- the run
        # would report a clean sync of zero records against a database that was
        # never there, and look entirely successful doing it.
        run: |
          missing=""
          for name in MONGO_URI PORTAL_EMAIL PORTAL_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi
          echo "credentials present"

      - name: Sync the portal
        # --skip-roles: submissions only. The roles crawl is ~52 admin page
        # fetches for assessments that rarely change, and it WRITES
        # assessments/<slug>.md, which is git-tracked -- doing it here would
        # leave the checkout dirty for no reason. roles-crawl.yml does that
        # weekly and commits the result.
        #
        # Exit 3 is not a failure: a review queue would not download, so the
        # rest of the sync stands but the grading queue is short. Said out loud
        # and carried on -- tomorrow's run re-fetches it.
        run: |
          set +e
          python manage.py ingest --skip-roles
          code=$?
          set -e
          case $code in
            0) echo "sync ok" ;;
            3) echo "::warning::A review queue would not download. Those candidates are missing from this sync and the grading queue is short. The next scheduled run re-fetches them." ;;
            *) echo "::error::Sync failed (exit $code)."; exit $code ;;
          esac
